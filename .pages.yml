  photo:
    type: "image"
    description: "Cliquez sur « Importer » pour ajouter une nouvelle photo depuis votre ordinateur ou téléphone (JPG, PNG ou WebP, toutes tailles : le site la redimensionne et l’optimise automatiquement). Vous pouvez aussi choisir une photo déjà importée."
    options:
      media: "photos"
      path: "uploads"
      rename: "safe"
media:
  - name: "blog"
    label: "Images du blog"
    input: "assets/img/blog"
    output: "/assets/img/blog"
  - name: "photos"
    label: "Photos du site (chantiers, portrait, pages)"
    input: "media"
    output: "/media"
    extensions: ["jpg", "jpeg", "png", "webp"]
    rename: "safe"
content:
  - name: "realisations"
    label: "Réalisations (photos de chantiers)"
    type: "file"
    format: "json"
    path: "content/realisations.json"
    fields:
      - name: "seo"
        label: "Référencement Google"
        type: "object"
        fields:
          - name: "title"
            label: "Titre dans Google (60 car. max)"
            type: "string"
            options:
              maxlength: 60
          - name: "description"
            label: "Description dans Google"
            type: "text"
      - name: "intro"
        label: "Introduction de la page"
        type: "object"
        fields:
          - name: "eyebrow"
            label: "Petit titre"
            type: "string"
          - name: "title"
            label: "Titre (H1)"
            type: "string"
          - name: "text"
            label: "Texte"
            type: "text"
      - name: "chantiers"
        label: "Chantiers (une carte avant/après par chantier)"
        type: "object"
        list:
          collapsible:
            collapsed: true
            summary: "{title} — {commune}"
        fields:
          - name: "before"
            label: "Photo AVANT (à importer en premier)"
            component: "photo"
          - name: "after"
            label: "Photo APRÈS"
            component: "photo"
          - name: "title"
            label: "Titre du chantier (ex. « Ravalement de façade à Soyaux »)"
            type: "string"
            required: true
          - name: "category"
            label: "Catégorie (sert au filtre de la page)"
            type: "select"
            required: true
            options:
              values:
                - value: "facade"
                  label: "Façade"
                - value: "toiture"
                  label: "Toiture"
                - value: "peinture"
                  label: "Peinture"
                - value: "isolation"
                  label: "Isolation"
          - name: "service"
            label: "Page service liée au bouton « Voir ce service »"
            type: "select"
            options:
              values:
                - value: "ravalement-facade-angouleme"
                  label: "Ravalement de façade"
                - value: "nettoyage-facade-angouleme"
                  label: "Nettoyage de façade"
                - value: "nettoyage-toiture-angouleme"
                  label: "Nettoyage de toiture"
                - value: "peinture-exterieure-charente"
                  label: "Peinture extérieure"
                - value: "isolation-interieure-charente"
                  label: "Isolation intérieure"
          - name: "commune"
            label: "Commune (optionnel)"
            type: "string"
          - name: "duration"
            label: "Durée du chantier (optionnel, ex. « 3 jours »)"
            type: "string"
          - name: "altBefore"
            label: "Description de la photo avant (optionnel)"
            type: "string"
          - name: "altAfter"
            label: "Description de la photo après (optionnel)"
            type: "string"
          - name: "draft"
            label: "Brouillon (ne pas afficher sur le site)"
            type: "boolean"
            default: false
  - name: "service-pages"
    label: "Pages de service"
    type: "group"
    items:
      - name: "page-ravalement"
        label: "Ravalement de façade"
        type: "file"
        format: "json"
        path: "content/pages/ravalement-facade-angouleme/page.json"
        fields:
          - name: "seo"
            label: "1. Référencement Google"
            type: "object"
            fields:
              - name: "title"
                label: "Titre dans Google (60 caractères maximum)"
                type: "string"
                required: true
                options:
                  maxlength: 60
              - name: "description"
                label: "Description dans Google (160 caractères conseillés)"
                type: "text"
                required: true
                options:
                  maxlength: 200
              - name: "keywords"
                label: "Mots-clés (séparés par des virgules)"
                type: "string"
          - name: "hero"
            label: "2. En-tête (photos avant/après + titre)"
            type: "object"
            fields:
              - name: "before"
                label: "Photo AVANT (à importer en premier)"
                component: "photo"
                description: "Cliquez sur « Importer » pour ajouter une nouvelle photo depuis votre ordinateur ou téléphone (JPG, PNG ou WebP, toutes tailles : le site la redimensionne et l’optimise automatiquement). Vous pouvez aussi choisir une photo déjà importée. Laissez les deux photos vides pour afficher une icône à la place."
              - name: "after"
                label: "Photo APRÈS"
                component: "photo"
              - name: "altBefore"
                label: "Description de la photo avant (accessibilité et Google)"
                type: "string"
              - name: "altAfter"
                label: "Description de la photo après"
                type: "string"
              - name: "title"
                label: "Titre principal (H1)"
                type: "string"
                required: true
              - name: "subtitle"
                label: "Phrase d’accroche sous le titre"
                type: "text"
              - name: "ctaLabel"
                label: "Texte du bouton « devis »"
                type: "string"
              - name: "placeholderIcon"
                label: "Icône (si pas de photos)"
                component: "icon"
              - name: "placeholderText"
                label: "Texte sous l’icône (si pas de photos)"
                type: "string"
          - name: "realisation"
            label: "3. Bloc « Avant / Après » (fiche chantier)"
            type: "object"
            fields:
              - name: "before"
                label: "Autre photo AVANT (optionnel)"
                component: "photo"
                description: "Laissez vide pour réutiliser les photos de l’en-tête."
              - name: "after"
                label: "Autre photo APRÈS (optionnel)"
                component: "photo"
              - name: "altBefore"
                label: "Description photo avant (optionnel)"
                type: "string"
              - name: "altAfter"
                label: "Description photo après (optionnel)"
                type: "string"
              - name: "title"
                label: "Titre"
                type: "string"
              - name: "intro"
                label: "Introduction"
                type: "text"
              - name: "sheetTitle"
                label: "Titre de la fiche"
                type: "string"
              - name: "facts"
                label: "Lignes de la fiche (Zone, Support, Problèmes…)"
                type: "object"
                list:
                  collapsible:
                    collapsed: true
                    summary: "{label}"
                fields:
                  - name: "label"
                    label: "Intitulé"
                    type: "string"
                  - name: "text"
                    label: "Texte"
                    type: "string"
              - name: "tipTitle"
                label: "Titre de l’encadré conseil"
                type: "string"
              - name: "tipHtml"
                label: "Texte de l’encadré conseil (liens possibles)"
                type: "rich-text"
                options:
                  format: "html"
                  switcher: false
                  media: false
          - name: "problem"
            label: "4. Le problème"
            type: "object"
            fields:
              - name: "eyebrow"
                label: "Petit titre au-dessus (ex. « Le problème »)"
                type: "string"
              - name: "title"
                label: "Titre de la section"
                type: "string"
              - name: "intro"
                label: "Texte d’introduction"
                type: "text"
              - name: "items"
                label: "Les problèmes"
                type: "object"
                list:
                  collapsible:
                    collapsed: true
                    summary: "{title}"
                fields:
                  - name: "icon"
                    label: "Icône"
                    component: "icon"
                  - name: "title"
                    label: "Titre"
                    type: "string"
                  - name: "text"
                    label: "Texte"
                    type: "text"
          - name: "solution"
            label: "5. Notre solution"
            type: "object"
            fields:
              - name: "eyebrow"
                label: "Petit titre au-dessus (ex. « Le problème »)"
                type: "string"
              - name: "title"
