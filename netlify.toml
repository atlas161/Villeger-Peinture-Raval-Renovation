# ═══════════════════════════════════════════════════════════════════════════════
# NETLIFY.TOML - Configuration de déploiement VPRR
# ═══════════════════════════════════════════════════════════════════════════════

[build]
  publish = "."
  command = "npm run build"

# ─────────────────────────────────────────────────────────────────────────────────
# OPTIMISATION DE LA PERFORMANCE
# ─────────────────────────────────────────────────────────────────────────────────

[functions]
  directory = "netlify/functions"

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = false

[build.processing.images]
  compress = true

# ─────────────────────────────────────────────────────────────────────────────────
# REDIRECTIONS
# ─────────────────────────────────────────────────────────────────────────────────

# API Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Redirection www vers non-www
[[redirects]]
  from = "https://www.vprr.fr/*"
  to = "https://vprr.fr/:splat"
  status = 301
  force = true

# Canonicalisation: forcer les URLs .html (évite les doublons /page vs /page.html)
[[redirects]]
