# ─────────────────────────────────────────────────────────────────────────────────
# HEADERS DE SÉCURITÉ
# ─────────────────────────────────────────────────────────────────────────────────

[[headers]]
  for = "/*"
  [headers.values]
    # Sécurité
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    # CSP (validée sur toutes les pages le 2026-09-29). Si un nouvel outil tiers est ajouté, ajouter son domaine ici.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.clarity.ms https://scripts.clarity.ms https://player.vimeo.com https://elfsightcdn.com https://static.elfsight.com https://challenges.cloudflare.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://i.vimeocdn.com https://*.vimeocdn.com https://*.elfsightcdn.com https://*.elfsight.com https://*.cdninstagram.com https://*.fbcdn.net https://www.google-analytics.com https://www.googletagmanager.com https://*.clarity.ms https://c.bing.com https://www.google.com https://*.doubleclick.net; font-src 'self' data:; media-src 'self' blob: https://*.vimeocdn.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://stats.g.doubleclick.net https://www.googletagmanager.com https://*.clarity.ms https://c.bing.com https://www.google.com https://*.doubleclick.net https://*.elfsight.com https://*.elfsightcdn.com https://challenges.cloudflare.com; frame-src https://player.vimeo.com https://challenges.cloudflare.com https://www.googletagmanager.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    
    # HSTS (force HTTPS)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# ─────────────────────────────────────────────────────────────────────────────────
# CACHE DES ASSETS STATIQUES
# ─────────────────────────────────────────────────────────────────────────────────

# Images - Cache long (1 an)
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# CSS / JS - noms de fichiers NON versionnés : toujours revalider (ETag) pour que les correctifs
# soient visibles immédiatement. Ne jamais remettre "immutable" ici sans hash dans le nom.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/blog/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/blog/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Bibliothèques hébergées (Font Awesome, Leaflet) : chemins versionnés, cache 1 an
[[headers]]
  for = "/assets/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Polices Inter : cache 1 an

[[headers]]
  for = "/assets/fonts/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Favicon - Cache long (1 an)
[[headers]]
  for = "/media/favicon/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Data (images WebP, etc.) - Cache long (1 an)
[[headers]]
  for = "/data/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# ─────────────────────────────────────────────────────────────────────────────────
# FICHIERS SEO ET ROBOTS
# ─────────────────────────────────────────────────────────────────────────────────

# robots.txt - Cache court (1 jour)
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "text/plain; charset=utf-8"

# sitemap.xml - Cache court (1 jour)
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/xml; charset=utf-8"

# llms.txt - Cache court (1 jour)
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "text/plain; charset=utf-8"

# security.txt
[[headers]]
  for = "/.well-known/security.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "text/plain; charset=utf-8"

# ─────────────────────────────────────────────────────────────────────────────────
# CONFIG JSON (pour le système de configuration)
# ─────────────────────────────────────────────────────────────────────────────────

[[headers]]
  for = "/data/config.json"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
    Content-Type = "application/json; charset=utf-8"

# ─────────────────────────────────────────────────────────────────────────────────
# HTML - Pas de cache (toujours frais)
# ─────────────────────────────────────────────────────────────────────────────────

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
